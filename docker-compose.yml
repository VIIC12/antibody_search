version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik-proxy
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - antibody-search-network
    restart: unless-stopped

  antibody-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antibody-search-app
    env_file:
      - .env
    volumes:
      # Mount data directory for persistence
      - ${ABHUNTER_DB_PATH}:/app/data/abhunter
      # Mount logs directory if needed
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - ABHUNTER_DB_PATH=/app/data/abhunter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antibody-search.rule=Host(`172.22.180.238`) || Host(`antibody.localhost`)"
      - "traefik.http.routers.antibody-search.entrypoints=web"
      - "traefik.http.services.antibody-search.loadbalancer.server.port=8501"
    networks:
      - antibody-search-network

  # Development service with hot reloading
  antibody-search-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antibody-search-dev
    env_file:
      - .env
    volumes:
      # Mount entire app directory for development (overwrites copied files)
      - .:/app
      # Mount data directory for persistence
      - ${ABHUNTER_DB_PATH}:/app/data/abhunter
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      - STREAMLIT_SERVER_FILE_WATCHER_POLL_INTERVAL=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - ABHUNTER_DB_PATH=/app/data/abhunter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antibody-search-dev.rule=Host(`172.22.180.238`) && PathPrefix(`/dev`)"
      - "traefik.http.routers.antibody-search-dev.entrypoints=web"
      - "traefik.http.services.antibody-search-dev.loadbalancer.server.port=8502"
      - "traefik.http.middlewares.antibody-search-dev-stripprefix.stripprefix.prefixes=/dev"
      - "traefik.http.routers.antibody-search-dev.middlewares=antibody-search-dev-stripprefix"
    networks:
      - antibody-search-network
    profiles:
      - dev

networks:
  antibody-search-network:
    driver: bridge

volumes:
  # Named volumes for data persistence
  antibody-data:
    driver: local
  antibody-logs:
    driver: local

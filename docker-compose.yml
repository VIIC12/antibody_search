services:
  antibody-search-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antibody-search-app
    deploy:
      resources:
        limits:
          cpus: '12.0'
          memory: 48G
    env_file:
      - .env
    volumes:
      # Mount data directory for persistence
      - ${ABHUNTER_DB_PATH}:/app/data/abhunter
      # Mount logs directory if needed
      - ./logs:/app/logs
      # Mount download directory for large file storage
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - ABHUNTER_DB_PATH=/app/data/abhunter
      - ABHUNTER_DOWNLOAD_DIR=/app/downloads
    profiles:
      - prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antibody-search.rule=(Host(`172.22.180.238`) || Host(`antibody.localhost`) || Host(`localhost`)) && !PathPrefix(`/dev`)"
      - "traefik.http.routers.antibody-search.entrypoints=web"
      - "traefik.http.routers.antibody-search.service=antibody-search"
      - "traefik.http.services.antibody-search.loadbalancer.server.port=8501"
      - "traefik.http.routers.antibody-search.middlewares=antibody-search-headers"
      - "traefik.http.routers.antibody-search.priority=1"
      - "traefik.http.middlewares.antibody-search-headers.headers.customrequestheaders.X-Forwarded-Proto=http"
      - "traefik.http.middlewares.antibody-search-headers.headers.customrequestheaders.X-Forwarded-For="
      - "traefik.http.middlewares.antibody-search-headers.headers.customrequestheaders.X-Real-IP="
    networks:
      - antibody-search-network
      - monitoring-network
  # Development service with hot reloading, and mounted volume for development
  antibody-search-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antibody-search-dev
    env_file:
      - .env
    volumes:
      # Mount entire app directory for development (overwrites copied files)
      - .:/app
      # Mount data directory for persistence
      - ${ABHUNTER_DB_PATH}:/app/data/abhunter
      - ./logs:/app/logs
      # Mount download directory for large file storage
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_BASE_URL_PATH=/dev
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      - STREAMLIT_SERVER_FILE_WATCHER_POLL_INTERVAL=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - ABHUNTER_DB_PATH=/app/data/abhunter
      - ABHUNTER_DOWNLOAD_DIR=/app/downloads
    command: ["streamlit", "run", "app.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
    deploy:
      resources:
        limits:
          cpus: '12.0'
          memory: 48G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/dev/_stcore/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antibody-search-dev.rule=(Host(`172.22.180.238`) || Host(`antibody.localhost`) || Host(`localhost`)) && PathPrefix(`/dev`)"
      - "traefik.http.routers.antibody-search-dev.entrypoints=web"
      - "traefik.http.routers.antibody-search-dev.service=antibody-search-dev"
      - "traefik.http.services.antibody-search-dev.loadbalancer.server.port=8502"
      - "traefik.http.routers.antibody-search-dev.priority=10"
      - "traefik.http.middlewares.antibody-search-dev-headers.headers.customrequestheaders.X-Forwarded-Proto=http"
      - "traefik.http.middlewares.antibody-search-dev-headers.headers.customrequestheaders.X-Forwarded-For="
      - "traefik.http.middlewares.antibody-search-dev-headers.headers.customrequestheaders.X-Real-IP="
      - "traefik.http.routers.antibody-search-dev.middlewares=antibody-search-dev-headers"
    networks:
      - antibody-search-network
      - monitoring-network

  # nginx service for serving large file downloads
  nginx-downloads:
    image: nginx:alpine
    container_name: nginx-downloads-antibody-search
    volumes:
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/usr/share/nginx/html/downloads:ro
      - ./nginx-downloads.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-downloads.rule=(Host(`172.22.180.238`) || Host(`antibody.localhost`) || Host(`localhost`)) && PathPrefix(`/downloads`)"
      - "traefik.http.routers.nginx-downloads.entrypoints=web"
      - "traefik.http.routers.nginx-downloads.service=nginx-downloads"
      - "traefik.http.services.nginx-downloads.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx-downloads.priority=5"
    networks:
      - antibody-search-network
    restart: unless-stopped

  # Download callback service - receives HTTP callbacks from nginx when downloads complete
  download-callback:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-callback-antibody-search
    command: ["python3", "scripts/download_callback_service.py", "--port", "8888", "--host", "0.0.0.0"]
    volumes:
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - ABHUNTER_DOWNLOAD_DIR=/app/downloads
      - PYTHONPATH=/app
    restart: unless-stopped
    networks:
      - antibody-search-network

  # Cleanup service for removing downloaded files after they've been marked
  download-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-cleanup-antibody-search
    command: ["python3", "scripts/cleanup_downloads.py", "--interval", "300"]
    volumes:
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - ABHUNTER_DOWNLOAD_DIR=/app/downloads
      - PYTHONPATH=/app
    restart: unless-stopped
    depends_on:
      - download-callback

  # OpenTelemetry Collector for traces only
  # Logs are collected by Alloy (in server/docker-compose.yml) and sent to Loki
  # This collector handles OTLP traces from Traefik and other services
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-antibody-search
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./logs:/var/log/otel-collector
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver (for traces)
      - "4318:4318"   # OTLP HTTP receiver (for traces)
    networks:
      - antibody-search-network
      - artifact-network
      - monitoring-network
    restart: unless-stopped

networks:
  antibody-search-network:
    external: true
    name: antibody-search-network
  artifact-network:
    external: true
    name: artifact-store_artifact-network
  monitoring-network:
    external: true
    name: monitoring-network

volumes:
  # Named volumes for data persistence
  antibody-data:
    driver: local
  antibody-logs:
    driver: local

server {
    listen 80;
    server_name _;

    # Root directory for downloads
    root /usr/share/nginx/html;
    
    # Disable directory listing
    autoindex off;
    
    # Logging
    access_log /var/log/nginx/downloads_access.log;
    error_log /var/log/nginx/downloads_error.log;

    # Location for download files
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        
        # Security: deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Set appropriate headers for file downloads
        add_header Content-Disposition 'attachment' always;
        add_header X-Content-Type-Options 'nosniff' always;
        
        # Enable range requests for large files
        max_ranges 0;
        
        # Log download completion
        log_subrequest on;
        
        # Extract filename from request URI for callback
        set $callback_filename $request_uri;
        if ($callback_filename ~ ^/downloads/(.+)$) {
            set $callback_filename $1;
        }
        
        # Call callback service after successful download (HTTP 200)
        # Note: post_action is called after the response is sent to client
        post_action @callback;
    }
    
    # Internal location to call callback service
    location @callback {
        internal;
        # Only call callback for successful downloads (HTTP 200)
        if ($status != 200) {
            return 204;  # No content, skip callback
        }
        
        # Call callback service with filename as query parameter
        # The callback service will handle both query param and JSON body
        proxy_pass http://download-callback:8888/mark-downloaded?filename=$callback_filename;
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "0";
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

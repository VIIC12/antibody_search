services:
  antibody-search-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antibody-search-app
    deploy:
      resources:
        limits:
          cpus: '22.0'
          memory: 48G
    env_file:
      - .env
    volumes:
      # Mount data directory for persistence
      - ${ABHUNTER_DB_PATH}:/app/data/abhunter
      # Mount logs directory if needed
      - ./logs:/app/logs
      # Mount download directory for large file storage
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - ABHUNTER_DB_PATH=/app/data/abhunter
      - ABHUNTER_DOWNLOAD_DIR=/app/downloads
    profiles:
      - prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antibody-search.rule=Host(`abhunter.iwe-lab.de`) && !PathPrefix(`/dev`)"
      - "traefik.http.routers.antibody-search.entrypoints=web"
      - "traefik.http.routers.antibody-search.service=antibody-search"
      - "traefik.http.services.antibody-search.loadbalancer.server.port=8501"
      - "traefik.http.routers.antibody-search.middlewares=antibody-search-headers"
      - "traefik.http.routers.antibody-search.priority=1"
      - "traefik.http.middlewares.antibody-search-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.antibody-search-headers.headers.customrequestheaders.X-Forwarded-For="
      - "traefik.http.middlewares.antibody-search-headers.headers.customrequestheaders.X-Real-IP="
    networks:
      - antibody-search-network
      - monitoring-network
  # Development service with hot reloading, and mounted volume for development


  # nginx service for serving large file downloads
  nginx-downloads:
    image: nginx:alpine
    container_name: nginx-downloads-antibody-search
    volumes:
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/usr/share/nginx/html/downloads:ro
      - ./nginx-downloads.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-downloads.rule=Host(`abhunter.iwe-lab.de`) && PathPrefix(`/downloads`)"
      - "traefik.http.routers.nginx-downloads.entrypoints=web"
      - "traefik.http.routers.nginx-downloads.service=nginx-downloads"
      - "traefik.http.services.nginx-downloads.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx-downloads.priority=5"
    networks:
      - antibody-search-network
    restart: unless-stopped

  # Download callback service - receives HTTP callbacks from nginx when downloads complete
  download-callback:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-callback-antibody-search
    command: ["python3", "scripts/download_callback_service.py", "--port", "8888", "--host", "0.0.0.0"]
    volumes:
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - ABHUNTER_DOWNLOAD_DIR=/app/downloads
      - PYTHONPATH=/app
    restart: unless-stopped
    networks:
      - antibody-search-network

  # Cleanup service for removing downloaded files after they've been marked
  download-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-cleanup-antibody-search
    command: ["python3", "scripts/cleanup_downloads.py", "--interval", "300"]
    volumes:
      - ${ABHUNTER_DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - ABHUNTER_DOWNLOAD_DIR=/app/downloads
      - PYTHONPATH=/app
    restart: unless-stopped
    depends_on:
      - download-callback


networks:
  antibody-search-network:
    external: true
    name: antibody-search-network
  monitoring-network:
    external: true
    name: monitoring-network

volumes:
  # Named volumes for data persistence
  antibody-data:
    driver: local
  antibody-logs:
    driver: local
